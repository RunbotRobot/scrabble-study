<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scrabble Study</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#a15c2f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scrabble Study" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Scrabble Study</h1>
    <dl id="stats" class="stats"></dl>
  </header>

  <main>
    <section class="panel" id="study-panel">
      <h2>Study</h2>
      <p id="milestone-message" class="milestone-message"></p>
      <div id="study-card" class="card">
        <p class="card-empty">Loading&hellip;</p>
      </div>
    </section>

    <section class="panel">
      <h2>Add a word</h2>
      <div id="queue-panel"></div>
    </section>

    <section class="panel">
      <h2>Cloud sync</h2>
      <div id="sync-panel"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
