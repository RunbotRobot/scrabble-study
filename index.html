<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scrabble Study</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#a15c2f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scrabble Study" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-row">
      <h1>Scrabble Study</h1>
      <button id="options-btn" class="lookup-btn" type="button" aria-label="Options">⚙</button>
    </div>
    <dl id="stats" class="stats"></dl>
  </header>

  <main>
    <section class="panel" id="study-panel">
      <h2>Study</h2>
      <p id="milestone-message" class="milestone-message"></p>
      <div id="study-card" class="card">
        <p class="card-empty">Loading&hellip;</p>
      </div>
    </section>
  </main>

  <div id="options-modal-root" class="lookup-overlay" hidden>
    <div class="lookup-dialog">
      <div class="lookup-top">
        <h2 class="options-title">Options</h2>
        <button id="options-close" class="secondary" type="button" aria-label="Close">✕</button>
      </div>
      <div class="lookup-body">
        <button id="lookup-btn" class="secondary" type="button">? Look up a word</button>
        <div class="options-section">
          <h3 class="options-subhead">Cloud sync</h3>
          <div id="sync-panel"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="lookup-modal-root"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
