name: Deploy sync worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Workers
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional: a free Gemini API key used as a fallback image generator
      # when Pollinations is rate-limited (see README's "Root word images"
      # section). Skipped entirely if the GEMINI_API_KEY repo secret isn't
      # set — the worker just keeps using Pollinations alone.
      - name: Set Gemini API key secret
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        run: echo "${{ secrets.GEMINI_API_KEY }}" | npx wrangler@4 secret put GEMINI_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
